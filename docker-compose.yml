version: "3.8"

services:
  excalidraw:
    build:
      context: .
      args:
        - NODE_ENV=development
    container_name: excalidraw
    ports:
      - "3000:80"
    restart: on-failure
    stdin_open: true
    healthcheck:
      disable: true
    environment:
      - NODE_ENV=development
      # Optional runtime overrides (no rebuild needed); see README
      - EXCALIDRAW_COLLAB_URL=${EXCALIDRAW_COLLAB_URL:-}
      - EXCALIDRAW_COLLAB_PATH=${EXCALIDRAW_COLLAB_PATH:-}
      - EXCALIDRAW_BACKEND_URL=${EXCALIDRAW_BACKEND_URL:-}
      - EXCALIDRAW_BACKEND_API_PREFIX=${EXCALIDRAW_BACKEND_API_PREFIX:-}
      - EXCALIDRAW_BACKEND_GET_URL=${EXCALIDRAW_BACKEND_GET_URL:-}
      - EXCALIDRAW_BACKEND_POST_URL=${EXCALIDRAW_BACKEND_POST_URL:-}
    volumes:
      - ./:/opt/node_app/app:delegated
      - ./package.json:/opt/node_app/package.json
      - ./yarn.lock:/opt/node_app/yarn.lock
      - notused:/opt/node_app/app/node_modules

volumes:
  notused:
