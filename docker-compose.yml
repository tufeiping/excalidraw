services:
  excalidraw:
    build:
      context: .
      # the app is built inside the image (multi-stage Dockerfile), so it must
      # be a production build
      args:
        - NODE_ENV=production
    container_name: excalidraw
    ports:
      - "3000:80"
    restart: on-failure
    healthcheck:
      disable: true
    environment:
      - NODE_ENV=production
      # Optional runtime overrides (no rebuild needed); see README
      - EXCALIDRAW_COLLAB_URL=${EXCALIDRAW_COLLAB_URL:-}
      - EXCALIDRAW_COLLAB_PATH=${EXCALIDRAW_COLLAB_PATH:-}
      - EXCALIDRAW_BACKEND_URL=${EXCALIDRAW_BACKEND_URL:-}
      - EXCALIDRAW_BACKEND_API_PREFIX=${EXCALIDRAW_BACKEND_API_PREFIX:-}
      - EXCALIDRAW_BACKEND_GET_URL=${EXCALIDRAW_BACKEND_GET_URL:-}
      - EXCALIDRAW_BACKEND_POST_URL=${EXCALIDRAW_BACKEND_POST_URL:-}
      - EXCALIDRAW_AI_PROVIDER=${EXCALIDRAW_AI_PROVIDER:-}
      - EXCALIDRAW_AI_BACKEND=${EXCALIDRAW_AI_BACKEND:-}
      - EXCALIDRAW_AI_MODEL=${EXCALIDRAW_AI_MODEL:-}
      - EXCALIDRAW_AI_API_KEY=${EXCALIDRAW_AI_API_KEY:-}
